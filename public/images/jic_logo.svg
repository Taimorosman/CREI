<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bd3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Diamond icon -->
  <!-- Top facets -->
  <polygon points="200,70 130,190 200,165 270,190" fill="url(#diamondGrad)" opacity="0.85"/>
  <polygon points="200,70 270,190 340,190" fill="url(#diamondGrad)" opacity="0.65"/>
  <polygon points="200,70 130,190 60,190" fill="url(#diamondGrad)" opacity="0.65"/>
  
  <!-- Bottom facets -->
  <polygon points="60,190 130,190 200,330" fill="url(#diamondGrad)" opacity="0.9"/>
  <polygon points="130,190 200,165 200,330" fill="url(#diamondGrad)" opacity="0.75"/>
  <polygon points="200,165 270,190 200,330" fill="url(#diamondGrad)" opacity="0.75"/>
  <polygon points="270,190 340,190 200,330" fill="url(#diamondGrad)" opacity="0.9"/>
  
  <!-- Outline for crispness -->
  <polyline points="200,70 340,190 200,330 60,190 200,70" fill="none" stroke="url(#diamondGrad)" stroke-width="5" stroke-linejoin="round"/>
  <line x1="60" y1="190" x2="340" y2="190" stroke="url(#diamondGrad)" stroke-width="3" opacity="0.5"/>
  <line x1="200" y1="70" x2="200" y2="165" stroke="white" stroke-width="2" opacity="0.4"/>
  
  <!-- Text: JOUDAH AL-IBTKAR -->
  <text x="400" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="100" font-weight="700" fill="#1D1D1D" letter-spacing="-2">JOUDAH AL-IBTKAR</text>
  
  <!-- Tagline in English -->
  <text x="402" y="265" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#4A4A4A" letter-spacing="8">QUALITY &amp; INNOVATION</text>
  
  <!-- Arabic text -->
  <text x="1380" y="200" font-family="'IBM Plex Sans Arabic', 'Tajawal', 'Cairo', 'Arial', sans-serif" font-size="80" font-weight="600" fill="#1D1D1D" text-anchor="end" direction="rtl">جودة الابتكار</text>
  
  <!-- Green accent underline -->
  <rect x="402" y="280" width="300" height="4" fill="url(#diamondGrad)" rx="2"/>
</svg>
